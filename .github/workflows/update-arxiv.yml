name: Update publications
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/update-arxiv.yml'
      - 'scripts/update-*.ps1'
  schedule:
    - cron: '23 12 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: update-arxiv
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh arXiv publications
        id: arxiv
        continue-on-error: true
        shell: pwsh
        run: ./scripts/update-arxiv.ps1
      - name: Refresh Substack posts
        id: substack
        continue-on-error: true
        shell: pwsh
        run: ./scripts/update-substack.ps1
      - name: Save changes
        id: save
        shell: bash
        run: |
          if ! git diff --quiet -- writings/index.html; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add writings/index.html
            git commit -m "Update publications"
            git push
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      # Bot commits do not trigger a Pages build automatically. Request it explicitly.
      - name: Rebuild GitHub Pages
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${{ github.repository }}/pages/builds
      - name: Report feed failures
        if: always() && (steps.arxiv.outcome == 'failure' || steps.substack.outcome == 'failure')
        run: |
          echo 'A publication feed failed. Its saved list was preserved; inspect the refresh steps above.'
          exit 1
