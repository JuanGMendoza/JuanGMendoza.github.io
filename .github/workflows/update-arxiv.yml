name: Update arXiv publications
on:
  schedule:
    - cron: '23 12 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: update-arxiv
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh publications
        shell: pwsh
        run: ./scripts/update-arxiv.ps1
      - name: Save changes
        shell: bash
        run: |
          if ! git diff --quiet -- writings/index.html; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add writings/index.html
            git commit -m "Update arXiv publications"
            git push
          fi
      # Bot commits do not trigger a Pages build automatically. Request it explicitly.
      - name: Rebuild GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${{ github.repository }}/pages/builds
